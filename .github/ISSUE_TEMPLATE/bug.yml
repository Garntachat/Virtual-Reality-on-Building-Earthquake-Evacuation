name: Bug
description: Report a reproducible problem without attaching participant data
title: "[Bug] "
labels: []
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [P0-safety-or-privacy, P1-blocking, P2-functional, P3-cosmetic]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Commit, Unity version, platform, and headset/runtime
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: Attachments contain no participant identity, raw participant log, credential, or private dataset
          required: true
