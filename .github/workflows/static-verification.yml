name: static-verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify repository structure and policies
        run: python3 Tools/verify_repo.py
      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD || git diff --check
